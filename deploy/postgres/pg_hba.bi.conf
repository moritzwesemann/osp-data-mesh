# pg_hba.conf für den optionalen BI-Zugang (deploy/docker-compose.bi-db.yml)
# NICHT LOKAL VERIFIZIERT.
#
# - Unix-Socket im Container (Wartung mit "docker compose exec db psql -U postgres"): wie im Standardabbild
# - Container-Netze des Compose-Projekts (Knoten, Migration, CLI, Superset): Passwort (SCRAM)
# - von außen (veröffentlichter Port): ausschließlich mesh_bi auf Datenbank mesh, nur mit TLS
#
# TYPE    DATABASE  USER     ADDRESS     METHOD
local     all       all                  trust
host      all       all      127.0.0.1/32 scram-sha-256
host      all       all      ::1/128     scram-sha-256
host      all       all      samenet     scram-sha-256
hostssl   mesh      mesh_bi  0.0.0.0/0   scram-sha-256
hostssl   mesh      mesh_bi  ::/0        scram-sha-256
