# pg_hba.conf für den optionalen BI-Zugang (deploy/docker-compose.bi-db.yml)
# Mit Docker 29 geprüft (deploy/verify-deployment.sh, Abschnitt 7): über den veröffentlichten Port – vom Server
# selbst (Gateway-Adresse von bi_access) wie über die Portweiterleitung – nur mesh_bi mit TLS.
#
# - Unix-Socket im Container (Wartung mit "docker compose exec db psql -U postgres"): wie im Standardabbild
# - internes Netz "backend" (Knoten, Migration, CLI, Superset; feste Subnetz-Adresse 172.31.251.0/24): Passwort (SCRAM)
# - Netz "bi_access" (172.31.250.0/24) und alles andere: ausschließlich mesh_bi auf Datenbank mesh, nur mit TLS.
#   Wichtig: Verbindungen über den veröffentlichten Port können mit der Gateway-Adresse von bi_access ankommen;
#   darum ist dort jede andere Rolle ausdrücklich abgelehnt ("reject"). Kein "samenet", weil es bi_access einschlösse.
# - Wer die Subnetze in docker-compose.bi-db.yml ändert, muss sie hier gleich ändern.
#
# TYPE    DATABASE  USER     ADDRESS            METHOD
local     all       all                         trust
host      all       all      127.0.0.1/32       scram-sha-256
host      all       all      ::1/128            scram-sha-256
hostssl   mesh      mesh_bi  172.31.250.0/24    scram-sha-256
host      all       all      172.31.250.0/24    reject
host      all       all      172.31.251.0/24    scram-sha-256
hostssl   mesh      mesh_bi  0.0.0.0/0          scram-sha-256
hostssl   mesh      mesh_bi  ::/0               scram-sha-256
host      all       all      0.0.0.0/0          reject
host      all       all      ::/0               reject
